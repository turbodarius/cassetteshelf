name = "cassetteshelf-checkout"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Publishable keys are public; safe to commit. Use pk_test_... while testing.
STRIPE_PUBLISHABLE_KEY = "pk_live_51UIzH9RBz4TLJ6m3ym1Atp6CtThp1CAZPioMlV5VCPxVuHwXYp1ZcyI2i6TBDFWbW4nkUzt0VAD6ZugsmxmTFQIF000r1ZIGfz"
# Sites allowed to call this worker (comma separated, no trailing slash).
ALLOWED_ORIGINS = "https://cassetteshelf.com,https://www.cassetteshelf.com,http://localhost:8000,https://new-features.cassetteshelf-preview.pages.dev"
# "New order" emails (sent through Resend, see README). Comma-separate
# several addresses. ORDER_EMAIL_FROM stays Resend's starter sender until a
# domain is verified in Resend.
ORDER_EMAIL_TO = "contact@cassetteshelf.com"
ORDER_EMAIL_FROM = "cassetteshelf orders <onboarding@resend.dev>"
# Linked from the emails.
DASHBOARD_URL = "https://cassetteshelf.com/admin/"
# "true" adds sales tax with Stripe Tax (see README). Anything else: no tax,
# customers pay items + shipping.
COLLECT_TAX = "false"

# Where the /admin dashboard saves the store settings (prices, countries,
# shipping, fees, tax). No id needed: `npm run deploy` creates it the first
# time and remembers it.
[[kv_namespaces]]
binding = "SETTINGS"

# Anonymous analytics events (page visits, checkout steps) for the
# dashboard's Analytics tab. Also created by `npm run deploy` the first time.
[[d1_databases]]
binding = "ANALYTICS"
database_name = "cassetteshelf-analytics"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_TOKEN        (the dashboard password)
#   npx wrangler secret put RESEND_API_KEY     (order emails)
# For local `wrangler dev`, put them in worker/.dev.vars instead (git-ignored).
